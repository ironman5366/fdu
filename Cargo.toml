[package]
name = "fdu"
version = "0.1.0"
edition = "2021"
description = "A fast, multi-threaded disk usage analyzer with an interactive TUI"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
humansize = "2"
anyhow = "1"
serde_json = "1"
rayon = "1"
async-channel = "2"

[[bin]]
name = "fdu"
path = "src/main.rs"

[[bin]]
name = "fdu-bench"
path = "src/bench.rs"

[[bin]]
name = "fdu-profile"
path = "src/profile.rs"
